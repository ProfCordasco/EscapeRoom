<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Operazione Zero — Terminale</title>
  <style>
    :root {
      --bg: #030711;
      --panel: rgba(5, 18, 34, .88);
      --panel-2: rgba(9, 31, 52, .78);
      --cyan: #3ef2ff;
      --cyan-soft: rgba(62, 242, 255, .16);
      --green: #42ff9b;
      --yellow: #ffd65a;
      --red: #ff5575;
      --text: #e8fbff;
      --muted: #91b7c2;
      --border: rgba(62, 242, 255, .35);
      --shadow: 0 0 26px rgba(62, 242, 255, .12);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(0, 164, 194, .24), transparent 42%),
        linear-gradient(rgba(62,242,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(62,242,255,.025) 1px, transparent 1px),
        var(--bg);
      background-size: auto, 34px 34px, 34px 34px, auto;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .25;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.018) 3px 4px);
    }

    button, input, select { font: inherit; }

    .app {
      width: min(1100px, calc(100% - 28px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 0 30px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(3, 13, 25, .82);
      box-shadow: var(--shadow);
    }

    .brand {
      font-family: "Courier New", ui-monospace, monospace;
      letter-spacing: .13em;
      font-weight: 800;
      color: var(--cyan);
      text-transform: uppercase;
    }

    .class-pill {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 7px 11px;
      border: 1px solid rgba(66,255,155,.4);
      border-radius: 999px;
      color: var(--green);
      background: rgba(66,255,155,.08);
      font-size: .88rem;
      font-weight: 750;
    }

    .panel {
      flex: 1;
      padding: clamp(20px, 4vw, 44px);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: linear-gradient(145deg, var(--panel), rgba(2, 10, 21, .94));
      box-shadow: var(--shadow), inset 0 0 34px rgba(62,242,255,.03);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--cyan);
      font-family: "Courier New", ui-monospace, monospace;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
      font-size: .78rem;
    }

    h1, h2, h3 { margin-top: 0; }
    h1 { margin-bottom: 12px; font-size: clamp(1.7rem, 4vw, 3rem); line-height: 1.05; }
    h2 { margin-bottom: 10px; font-size: clamp(1.3rem, 3vw, 2rem); }
    h3 { margin-bottom: 8px; font-size: 1.06rem; }
    p { color: var(--muted); line-height: 1.55; }

    .grid { display: grid; gap: 14px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .field { display: grid; gap: 7px; margin-bottom: 14px; }
    label { color: #c9f8ff; font-size: .9rem; font-weight: 700; }

    input, select {
      width: 100%;
      padding: 12px 13px;
      border-radius: 10px;
      border: 1px solid rgba(145,183,194,.35);
      color: var(--text);
      background: rgba(0,0,0,.28);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(62,242,255,.11);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 11px 16px;
      border: 1px solid rgba(62,242,255,.5);
      border-radius: 10px;
      color: #001116;
      background: var(--cyan);
      font-weight: 850;
      cursor: pointer;
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }

    .btn:hover { transform: translateY(-1px); filter: brightness(1.08); box-shadow: 0 0 20px rgba(62,242,255,.25); }
    .btn:active { transform: translateY(0); }
    .btn.secondary { color: var(--cyan); background: transparent; }
    .btn.danger { color: #fff; border-color: rgba(255,85,117,.6); background: rgba(255,85,117,.22); }
    .btn:disabled { opacity: .38; cursor: not-allowed; transform: none; filter: none; box-shadow: none; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

    .room-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .room {
      position: relative;
      padding: 17px;
      border: 1px solid rgba(145,183,194,.26);
      border-radius: 14px;
      background: var(--panel-2);
      overflow: hidden;
    }

    .room::after {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      right: -45px;
      bottom: -55px;
      border-radius: 50%;
      background: rgba(62,242,255,.08);
      filter: blur(4px);
    }

    .room.done { border-color: rgba(66,255,155,.52); background: rgba(12,55,45,.46); }
    .room-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .status { font-family: "Courier New", monospace; font-weight: 900; font-size: .84rem; }
    .status.ok { color: var(--green); }
    .status.wait { color: var(--yellow); }
    .room-form { display: flex; gap: 8px; margin-top: 12px; position: relative; z-index: 1; }
    .room-form input { min-width: 0; text-transform: uppercase; }

    .progress-track {
      height: 12px;
      margin: 15px 0 8px;
      border: 1px solid rgba(145,183,194,.22);
      border-radius: 999px;
      background: rgba(0,0,0,.32);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #00afc8, var(--green));
      box-shadow: 0 0 15px rgba(66,255,155,.45);
      transition: width .4s ease;
    }

    .message {
      min-height: 24px;
      margin-top: 11px;
      font-family: "Courier New", monospace;
      font-size: .9rem;
    }
    .message.error { color: var(--red); }
    .message.success { color: var(--green); }

    .locked {
      margin-top: 18px;
      padding: 16px;
      border: 1px dashed rgba(255,214,90,.38);
      border-radius: 12px;
      color: var(--yellow);
      background: rgba(255,214,90,.05);
    }

    .admin-card {
      padding: 16px;
      border: 1px solid rgba(145,183,194,.23);
      border-radius: 13px;
      background: rgba(0,0,0,.2);
      margin-top: 15px;
    }

    .tiny { font-size: .78rem; color: var(--muted); }
    .hidden { display: none !important; }

    body.compact-view .app {
      width: 100%;
      min-height: 0;
      padding: 0;
    }

    body.compact-view .topbar { display: none; }

    body.compact-view .panel {
      min-height: 0;
      padding: 8px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    body.compact-view .room-list { margin-top: 0; }

    body.compact-view .room {
      padding: 14px;
      background: rgba(5, 18, 34, .9);
    }

    /* Mini-dashboard: usata nel piccolo monitor dell'atrio.
       Si attiva automaticamente in un iframe stretto/basso oppure con &mode=mini. */
    body.mini-view {
      overflow: hidden;
    }

    body.mini-view .app,
    body.mini-view .panel {
      width: 100%;
      height: 100vh;
      min-height: 0;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    body.mini-view .room-list {
      height: 100vh;
      margin: 0;
      padding: 3px;
      gap: 4px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }

    body.mini-view .room {
      min-width: 0;
      min-height: 0;
      padding: 6px 7px;
      border-radius: 7px;
      overflow: hidden;
    }

    body.mini-view .room-head {
      height: 100%;
      align-items: center;
    }

    body.mini-view .room-head > div {
      min-width: 0;
      overflow: hidden;
    }

    body.mini-view .room .eyebrow {
      margin-bottom: 2px;
      font-size: clamp(.42rem, 2.3vw, .62rem);
      line-height: 1;
    }

    body.mini-view .room h3 {
      margin: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(.55rem, 3vw, .83rem);
      line-height: 1.05;
    }

    body.mini-view .status {
      flex: 0 0 auto;
      width: 12px;
      height: 12px;
      overflow: hidden;
      color: transparent;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 8px rgba(255,214,90,.55);
    }

    body.mini-view .status.ok {
      background: var(--green);
      box-shadow: 0 0 8px rgba(66,255,155,.65);
    }

    body.mini-view .room-form,
    body.mini-view .room > p,
    body.mini-view .room > .message,
    body.mini-view .mission-summary {
      display: none !important;
    }

    @media (max-width: 680px) {
      .grid.two, .room-list { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .room-form { flex-direction: column; }
      .room-form .btn { width: 100%; }
    }

    @media (max-width: 520px), (max-height: 300px) {
      body.compact-view:not(.full-view) {
        overflow: hidden;
      }

      body.compact-view:not(.full-view) .app,
      body.compact-view:not(.full-view) .panel {
        width: 100%; height: 100vh; min-height: 0; padding: 0; margin: 0; overflow: hidden;
      }

      body.compact-view:not(.full-view) .room-list {
        height: 100vh; margin: 0; padding: 3px; gap: 4px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }

      body.compact-view:not(.full-view) .room {
        min-width: 0; min-height: 0; padding: 6px 7px; border-radius: 7px; overflow: hidden;
      }

      body.compact-view:not(.full-view) .room-head { height: 100%; align-items: center; }
      body.compact-view:not(.full-view) .room-head > div { min-width: 0; overflow: hidden; }
      body.compact-view:not(.full-view) .room .eyebrow { margin-bottom: 2px; font-size: clamp(.42rem, 2.3vw, .62rem); line-height: 1; }
      body.compact-view:not(.full-view) .room h3 { margin: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: clamp(.55rem, 3vw, .83rem); line-height: 1.05; }
      body.compact-view:not(.full-view) .status { flex: 0 0 auto; width: 12px; height: 12px; overflow: hidden; color: transparent; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 8px rgba(255,214,90,.55); }
      body.compact-view:not(.full-view) .status.ok { background: var(--green); box-shadow: 0 0 8px rgba(66,255,155,.65); }
      body.compact-view:not(.full-view) .room-form,
      body.compact-view:not(.full-view) .room > p,
      body.compact-view:not(.full-view) .room > .message,
      body.compact-view:not(.full-view) .mission-summary { display: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">{...} Operazione Zero</div>
      <div id="activeClassPill" class="class-pill">Classe non selezionata</div>
    </header>
    <section id="screen" class="panel" aria-live="polite"></section>
  </main>

  <script>
    "use strict";

    /* ============================================================
       CONFIGURAZIONE INIZIALE
       Tutti questi valori possono essere cambiati anche dal
       pannello docente senza modificare il file.
       PIN iniziale: 2409
       ============================================================ */
    const DEFAULT_CONFIG = {
      teacherPin: "2627",
      classes: [
        "1A", "2A", "3A", "4A",
        "1B", "2B", "3B", "4B", "5B",
        "1C", "2C", "3C", "4C", "5C",
        "1D", "2D", "3D", "4D", "5D",
        "1E", "2E", "3E", "4E", "5E",
        "1F", "2F", "3F", "4F", "5F",
        "1L", "2L", "3L", "4L", "5L"
      ],
      rooms: [
        { id: "osservazione", name: "Sala di osservazione", code: "OCCHIO7" },
        { id: "logica", name: "Archivio logico", code: "LOGICA4" },
        { id: "informatica", name: "Laboratorio informatico", code: "BYTE9" },
        { id: "assistenza", name: "Sala assistenza", code: "RETE2" }
      ]
    };

    const KEYS = {
      config: "oz_config_v1",
      activeClass: "oz_active_class_v1",
      progressPrefix: "oz_progress_v1_"
    };

    const screen = document.getElementById("screen");
    const pill = document.getElementById("activeClassPill");
    const params = new URLSearchParams(location.search);
    const requestedView = (params.get("view") || "auto").toLowerCase();
    const displayMode = (params.get("mode") || "auto").toLowerCase();

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function loadConfig() {
      try {
        const stored = JSON.parse(localStorage.getItem(KEYS.config));
        if (stored && Array.isArray(stored.classes) && Array.isArray(stored.rooms)) return stored;
      } catch (_) {}
      const initial = clone(DEFAULT_CONFIG);
      localStorage.setItem(KEYS.config, JSON.stringify(initial));
      return initial;
    }

    function saveConfig(config) {
      localStorage.setItem(KEYS.config, JSON.stringify(config));
    }

    function getActiveClass() {
      return localStorage.getItem(KEYS.activeClass) || "";
    }

    function setActiveClass(className) {
      localStorage.setItem(KEYS.activeClass, className);
      updatePill();
    }

    function progressKey(className) {
      return KEYS.progressPrefix + encodeURIComponent(className);
    }

    function emptyProgress(config) {
      return {
        completed: Object.fromEntries(config.rooms.map(room => [room.id, false])),
        updatedAt: new Date().toISOString()
      };
    }

    function loadProgress(className, config = loadConfig()) {
      if (!className) return emptyProgress(config);
      try {
        const stored = JSON.parse(localStorage.getItem(progressKey(className)));
        if (stored && stored.completed) {
          for (const room of config.rooms) {
            if (typeof stored.completed[room.id] !== "boolean") stored.completed[room.id] = false;
          }
          return stored;
        }
      } catch (_) {}
      const progress = emptyProgress(config);
      saveProgress(className, progress);
      return progress;
    }

    function saveProgress(className, progress) {
      progress.updatedAt = new Date().toISOString();
      localStorage.setItem(progressKey(className), JSON.stringify(progress));
    }

    function normalize(value) {
      return String(value || "")
        .trim()
        .toLocaleUpperCase("it-IT")
        .replace(/\s+/g, "");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[char]);
    }

    function updatePill() {
      const active = getActiveClass();
      pill.textContent = active ? `Classe attiva: ${active}` : "Classe non selezionata";
    }

    function showMessage(id, text, type = "error") {
      const box = document.getElementById(id);
      if (!box) return;
      box.className = `message ${type}`;
      box.textContent = text;
    }

    function requireClass() {
      const active = getActiveClass();
      if (!active) {
        screen.innerHTML = `
          <p class="eyebrow">Configurazione richiesta</p>
          <h1>Nessuna classe selezionata</h1>
          <p>La docente deve attivare una classe prima di iniziare la missione.</p>
          <div class="actions"><button class="btn" id="goSetup">Seleziona la classe</button></div>`;
        document.getElementById("goSetup").addEventListener("click", renderSetup);
        return "";
      }
      return active;
    }

    function renderSetup() {
      const config = loadConfig();
      const active = getActiveClass();
      const options = config.classes.map(c => `<option value="${escapeHtml(c)}" ${c === active ? "selected" : ""}>${escapeHtml(c)}</option>`).join("");
      screen.innerHTML = `
        <p class="eyebrow">Accesso docente</p>
        <h1>Seleziona la classe</h1>
        <p>Salva la classe della sessione, quindi prosegui con la navigazione in Genially.</p>
        <form id="setupForm" autocomplete="off">
          <div class="grid two">
            <div class="field">
              <label for="classSelect">Classe</label>
              <select id="classSelect" required>${options}</select>
            </div>
            <div class="field">
              <label for="setupPin">PIN docente</label>
              <input id="setupPin" type="password" inputmode="numeric" required>
            </div>
          </div>
          <div class="actions">
            <button class="btn" type="submit">SALVA</button>
            <button class="btn secondary" type="button" id="changeClass">CAMBIA CLASSE</button>
            <button class="btn secondary" type="button" id="openAdmin">Pannello docente</button>
          </div>
          <div id="setupMessage" class="message"></div>
        </form>`;

      const classSelect = document.getElementById("classSelect");
      const setupPin = document.getElementById("setupPin");
      if (active && config.classes.includes(active)) {
        classSelect.disabled = true;
        showMessage("setupMessage", `Classe ${active} già salvata. Puoi proseguire in Genially.`, "success");
      }

      document.getElementById("setupForm").addEventListener("submit", event => {
        event.preventDefault();
        const pin = setupPin.value;
        if (pin !== config.teacherPin) {
          showMessage("setupMessage", "PIN non corretto.");
          return;
        }
        const selected = classSelect.value;
        setActiveClass(selected);
        loadProgress(selected, config);
        classSelect.disabled = true;
        setupPin.value = "";
        showMessage("setupMessage", `Classe ${selected} salvata. Ora puoi proseguire in Genially.`, "success");
      });

      document.getElementById("changeClass").addEventListener("click", () => {
        classSelect.disabled = false;
        setupPin.value = "";
        classSelect.focus();
        showMessage("setupMessage", "Seleziona la nuova classe, inserisci il PIN e premi SALVA.", "success");
      });
      document.getElementById("openAdmin").addEventListener("click", renderAdminLogin);
    }

    function renderDashboard() {
      const active = requireClass();
      if (!active) return;
      const compact = requestedView === "avanzamento" || requestedView === "dashboard";
      document.body.classList.toggle("compact-view", compact);
      document.body.classList.toggle("mini-view", compact && displayMode === "mini");
      document.body.classList.toggle("full-view", compact && displayMode === "full");
      const config = loadConfig();
      const progress = loadProgress(active, config);
      const completedCount = config.rooms.filter(room => progress.completed[room.id]).length;
      const percent = Math.round((completedCount / config.rooms.length) * 100);

      const roomsHtml = config.rooms.map((room, index) => {
        const done = Boolean(progress.completed[room.id]);
        return `
          <article class="room ${done ? "done" : ""}">
            <div class="room-head">
              <div>
                <p class="eyebrow">Area ${index + 1}</p>
                <h3>${escapeHtml(room.name)}</h3>
              </div>
              <span class="status ${done ? "ok" : "wait"}">${done ? "COMPLETATA" : "IN ATTESA"}</span>
            </div>
            ${done ? `<p>Codice verificato e registrato per la classe ${escapeHtml(active)}.</p>` : `
              <form class="room-form" data-room="${escapeHtml(room.id)}" autocomplete="off">
                <input aria-label="Codice ${escapeHtml(room.name)}" placeholder="Inserisci il codice recuperato" required>
                <button class="btn" type="submit">Verifica</button>
              </form>
              <div id="msg-${escapeHtml(room.id)}" class="message"></div>`}
          </article>`;
      }).join("");

      screen.innerHTML = compact ? `
        <div class="room-list">${roomsHtml}</div>
        <div class="admin-card mission-summary">
          <p class="eyebrow">Riepilogo missione</p>
          <p><strong>Classe ${escapeHtml(active)}</strong> — ${completedCount} aree completate su ${config.rooms.length}.</p>
          <div class="progress-track" aria-label="Avanzamento ${percent}%"><div class="progress-bar" style="width:${percent}%"></div></div>
          ${completedCount === config.rooms.length ? `
            <div class="locked" style="border-color:rgba(66,255,155,.48);color:var(--green);background:rgba(66,255,155,.07)">
              TUTTE LE STANZE COMPLETATE — I quattro frammenti sono stati convalidati. Cercate nell’ambiente l’indizio che stabilisce come comporli.
            </div>` : ""}
        </div>` : `
        <p class="eyebrow">Terminale centrale</p>
        <h1>Stato della missione</h1>
        <p>${completedCount} aree completate su ${config.rooms.length}.</p>
        <div class="progress-track" aria-label="Avanzamento ${percent}%"><div class="progress-bar" style="width:${percent}%"></div></div>
        <div class="room-list">${roomsHtml}</div>
        ${completedCount === config.rooms.length ? `
          <div class="locked" style="border-color:rgba(66,255,155,.48);color:var(--green);background:rgba(66,255,155,.07)">
            TUTTE LE STANZE COMPLETATE — I quattro frammenti sono stati convalidati. Cercate nell’ambiente l’indizio che stabilisce come comporli.
          </div>` : ""}
        <div class="actions">
          <button class="btn secondary" id="switchClass">Cambia classe</button>
        </div>`;

      document.querySelectorAll(".room-form").forEach(form => {
        form.addEventListener("submit", event => {
          event.preventDefault();
          const roomId = form.dataset.room;
          const room = config.rooms.find(item => item.id === roomId);
          const answer = form.querySelector("input").value;
          if (!room || normalize(answer) !== normalize(room.code)) {
            showMessage(`msg-${roomId}`, "Codice non riconosciuto. Controllate gli indizi e riprovate.");
            return;
          }
          const current = loadProgress(active, config);
          current.completed[roomId] = true;
          saveProgress(active, current);
          renderDashboard();
        });
      });

      const switchClassButton = document.getElementById("switchClass");
      if (switchClassButton) switchClassButton.addEventListener("click", renderSetup);
    }

    function renderAdminLogin() {
      const config = loadConfig();
      screen.innerHTML = `
        <p class="eyebrow">Area riservata</p>
        <h1>Pannello docente</h1>
        <form id="adminLogin" autocomplete="off">
          <div class="field">
            <label for="adminPin">PIN docente</label>
            <input id="adminPin" type="password" inputmode="numeric" required>
          </div>
          <div class="actions">
            <button class="btn" type="submit">Accedi</button>
            <button class="btn secondary" type="button" id="adminBack">Indietro</button>
          </div>
          <div id="adminLoginMessage" class="message"></div>
        </form>`;
      document.getElementById("adminLogin").addEventListener("submit", event => {
        event.preventDefault();
        if (document.getElementById("adminPin").value !== config.teacherPin) {
          showMessage("adminLoginMessage", "PIN non corretto.");
          return;
        }
        renderAdmin();
      });
      document.getElementById("adminBack").addEventListener("click", renderSetup);
    }

    function renderAdmin() {
      const config = loadConfig();
      const active = getActiveClass();
      const roomFields = config.rooms.map((room, index) => `
        <div class="grid two">
          <div class="field">
            <label for="roomName${index}">Nome stanza ${index + 1}</label>
            <input id="roomName${index}" value="${escapeHtml(room.name)}" required>
          </div>
          <div class="field">
            <label for="roomCode${index}">Codice stanza ${index + 1}</label>
            <input id="roomCode${index}" value="${escapeHtml(room.code)}" required>
          </div>
        </div>`).join("");

      const classRows = config.classes.map(className => {
        const p = loadProgress(className, config);
        const count = config.rooms.filter(room => p.completed[room.id]).length;
        return `<option value="${escapeHtml(className)}">${escapeHtml(className)} — ${count}/${config.rooms.length}</option>`;
      }).join("");

      screen.innerHTML = `
        <p class="eyebrow">Area riservata</p>
        <h1>Pannello docente</h1>
        <form id="configForm" autocomplete="off">
          <div class="admin-card">
            <h3>Classi e sicurezza</h3>
            <div class="grid two">
              <div class="field">
                <label for="classesInput">Classi, separate da virgola</label>
                <input id="classesInput" value="${escapeHtml(config.classes.join(", "))}" required>
              </div>
              <div class="field">
                <label for="teacherPinInput">PIN docente</label>
                <input id="teacherPinInput" value="${escapeHtml(config.teacherPin)}" required>
              </div>
            </div>
          </div>
          <div class="admin-card">
            <h3>Codici delle stanze</h3>
            ${roomFields}
          </div>
          <div class="actions">
            <button class="btn" type="submit">Salva configurazione</button>
            <button class="btn secondary" type="button" id="adminToSetup">Selezione classe</button>
          </div>
          <div id="configMessage" class="message"></div>
        </form>

        <div class="admin-card">
          <h3>Gestione progressi</h3>
          <div class="field">
            <label for="manageClass">Classe da gestire</label>
            <select id="manageClass">${classRows}</select>
          </div>
          <div class="actions">
            <button class="btn secondary" id="activateManaged">Attiva questa classe</button>
            <button class="btn danger" id="resetManaged">Azzera i suoi progressi</button>
          </div>
          <div id="manageMessage" class="message"></div>
          <p class="tiny">Classe attualmente attiva: ${escapeHtml(active || "nessuna")}.</p>
        </div>`;

      document.getElementById("configForm").addEventListener("submit", event => {
        event.preventDefault();
        const classes = document.getElementById("classesInput").value
          .split(",").map(item => item.trim()).filter(Boolean);
        if (!classes.length) {
          showMessage("configMessage", "Inserisci almeno una classe.");
          return;
        }
        config.classes = [...new Set(classes)];
        config.teacherPin = document.getElementById("teacherPinInput").value.trim();
        config.rooms = config.rooms.map((room, index) => ({
          ...room,
          name: document.getElementById(`roomName${index}`).value.trim(),
          code: document.getElementById(`roomCode${index}`).value.trim()
        }));
        saveConfig(config);
        showMessage("configMessage", "Configurazione salvata.", "success");
        setTimeout(renderAdmin, 500);
      });

      document.getElementById("adminToSetup").addEventListener("click", renderSetup);
      document.getElementById("activateManaged").addEventListener("click", () => {
        const selected = document.getElementById("manageClass").value;
        setActiveClass(selected);
        showMessage("manageMessage", `Classe ${selected} attivata.`, "success");
      });
      document.getElementById("resetManaged").addEventListener("click", () => {
        const selected = document.getElementById("manageClass").value;
        if (!confirm(`Azzerare tutti i progressi della classe ${selected}?`)) return;
        localStorage.removeItem(progressKey(selected));
        loadProgress(selected, config);
        showMessage("manageMessage", `Progressi della classe ${selected} azzerati.`, "success");
        setTimeout(renderAdmin, 600);
      });
    }

    function renderByRequestedView() {
      updatePill();
      const active = getActiveClass();
      if (requestedView === "selezione" || requestedView === "setup") return renderSetup();
      if (requestedView === "avanzamento" || requestedView === "dashboard") return renderDashboard();
      if (requestedView === "uscita" || requestedView === "exit") return renderDashboard();
      if (requestedView === "admin") return renderAdminLogin();
      if (!active) return renderSetup();
      return renderDashboard();
    }

    window.addEventListener("storage", renderByRequestedView);
    renderByRequestedView();

    // Aggiorna automaticamente un iframe già aperto se un altro iframe
    // modifica lo stato nello stesso browser.
    let lastSnapshot = JSON.stringify({
      className: getActiveClass(),
      config: localStorage.getItem(KEYS.config),
      progress: getActiveClass() ? localStorage.getItem(progressKey(getActiveClass())) : null
    });
    setInterval(() => {
      const className = getActiveClass();
      const snapshot = JSON.stringify({
        className,
        config: localStorage.getItem(KEYS.config),
        progress: className ? localStorage.getItem(progressKey(className)) : null
      });
      if (snapshot !== lastSnapshot) {
        lastSnapshot = snapshot;
        renderByRequestedView();
      }
    }, 1200);
  </script>
</body>
</html>
