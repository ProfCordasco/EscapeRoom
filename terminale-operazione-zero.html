<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Stato della missione — Monitor v2</title>
  <style>
    :root{--bg:#030711;--panel:rgba(5,18,34,.9);--panel-2:rgba(9,31,52,.82);--cyan:#3ef2ff;--green:#42ff9b;--yellow:#ffd65a;--red:#ff5575;--text:#e8fbff;--muted:#91b7c2;--border:rgba(62,242,255,.35)}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;color:var(--text);background:radial-gradient(circle at 50% -10%,rgba(0,164,194,.24),transparent 42%),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}
    .app{width:min(1100px,calc(100% - 28px));min-height:100vh;margin:auto;padding:24px 0 30px}.panel{padding:clamp(20px,4vw,44px);border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,var(--panel),rgba(2,10,21,.95));box-shadow:0 0 26px rgba(62,242,255,.12)}
    h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,3rem)}h3{margin:0;font-size:1.06rem}p{color:var(--muted);line-height:1.5}.eyebrow{margin:0 0 7px;color:var(--cyan);font:800 .78rem "Courier New",monospace;letter-spacing:.14em;text-transform:uppercase}
    .progress-track{height:12px;margin:15px 0 8px;overflow:hidden;border:1px solid rgba(145,183,194,.22);border-radius:999px;background:rgba(0,0,0,.32)}.progress-bar{height:100%;background:linear-gradient(90deg,#00afc8,var(--green));transition:width .4s ease}
    .room-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}.room{position:relative;overflow:hidden;padding:17px;border:1px solid rgba(145,183,194,.26);border-radius:14px;background:var(--panel-2)}.room.done{border-color:rgba(66,255,155,.52);background:rgba(12,55,45,.46)}.room-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.status{color:var(--yellow);font:900 .84rem "Courier New",monospace}.status.ok{color:var(--green)}
    .room-form{display:flex;gap:8px;margin-top:12px}input,select{width:100%;min-width:0;padding:12px 13px;color:var(--text);background:rgba(0,0,0,.28);border:1px solid rgba(145,183,194,.35);border-radius:10px;outline:none}.room-form input{text-transform:uppercase}input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(62,242,255,.11)}.btn{min-height:44px;padding:11px 16px;color:#001116;background:var(--cyan);border:1px solid rgba(62,242,255,.5);border-radius:10px;font-weight:850;cursor:pointer}.message{min-height:22px;margin-top:9px;color:var(--red);font:.88rem "Courier New",monospace}
    .locked{margin-top:18px;padding:16px;color:var(--green);border:1px dashed rgba(66,255,155,.48);border-radius:12px;background:rgba(66,255,155,.07)}.class-control{display:grid;grid-template-columns:auto minmax(130px,230px);align-items:center;justify-content:end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(145,183,194,.2)}.class-control label{color:var(--muted);font-size:.9rem;font-weight:700}
    body.compact .app,body.compact .panel{width:100%;min-height:0;padding:0;margin:0;border:0;border-radius:0;background:transparent;box-shadow:none}body.compact .dashboard-heading,body.compact .class-control{display:none}body.compact .room-list{margin:0;padding:3px;gap:4px}body.mini{overflow:hidden}body.mini .room-list{height:100vh;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}body.mini .room{min-width:0;min-height:0;padding:6px 7px;border-radius:7px}body.mini .room-head{height:100%;align-items:center}body.mini .room-head>div{min-width:0;overflow:hidden}body.mini .room .eyebrow{margin-bottom:2px;font-size:clamp(.42rem,2.3vw,.62rem);line-height:1}body.mini .room h3{overflow:hidden;margin:0;font-size:clamp(.55rem,3vw,.83rem);line-height:1.05;white-space:nowrap;text-overflow:ellipsis}body.mini .status{width:12px;height:12px;overflow:hidden;flex:0 0 auto;color:transparent;border-radius:50%;background:var(--yellow);box-shadow:0 0 8px rgba(255,214,90,.55)}body.mini .status.ok{background:var(--green);box-shadow:0 0 8px rgba(66,255,155,.65)}body.mini .room-form,body.mini .room>p,body.mini .message,body.mini .mission-summary{display:none!important}@media(max-width:680px){.room-list{grid-template-columns:1fr}.room-form{flex-direction:column}.class-control{grid-template-columns:1fr;justify-content:stretch}}
  </style>
</head>
<body>
  <main class="app"><section id="screen" class="panel" aria-live="polite"></section></main>
  <script>
    "use strict";
    const CLASSES=["1A","2A","3A","4A","1B","2B","3B","4B","5B","1C","2C","3C","4C","5C","1D","2D","3D","4D","5D","1E","2E","3E","4E","5E","1F","2F","3F","4F","5F","1L","2L","3L","4L","5L"];
    const ROOMS=[
      {id:"osservazione",name:"Sala di osservazione",code:"LENTE"},
      {id:"logica",name:"Archivio logico",code:"ORDINE"},
      {id:"informatica",name:"Laboratorio informatico",code:"SISTEMA"},
      {id:"assistenza",name:"Sala assistenza",code:"ASSISTENZA"}
    ];
    const ACTIVE_CLASS_KEY="oz_active_class_v1",PROGRESS_PREFIX="oz_progress_v1_";
    const params=new URLSearchParams(location.search),compact=["avanzamento","dashboard"].includes((params.get("view")||"").toLowerCase()),mini=compact&&(params.get("mode")||"").toLowerCase()==="mini";
    document.body.classList.toggle("compact",compact);document.body.classList.toggle("mini",mini);const screen=document.getElementById("screen");
    function normalize(v){return String(v||"").trim().toLocaleUpperCase("it-IT").replace(/\s+/g,"")}
    function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c])}
    function progressKey(c){return PROGRESS_PREFIX+encodeURIComponent(c)}
    function activeClass(){const c=localStorage.getItem(ACTIVE_CLASS_KEY);return CLASSES.includes(c)?c:"1A"}
    function emptyProgress(){return{completed:Object.fromEntries(ROOMS.map(r=>[r.id,false])),updatedAt:new Date().toISOString()}}
    function loadProgress(c){try{const p=JSON.parse(localStorage.getItem(progressKey(c)));if(p&&p.completed){ROOMS.forEach(r=>{if(typeof p.completed[r.id]!=="boolean")p.completed[r.id]=false});return p}}catch(_){}const p=emptyProgress();saveProgress(c,p);return p}
    function saveProgress(c,p){p.updatedAt=new Date().toISOString();localStorage.setItem(progressKey(c),JSON.stringify(p))}
    function render(){
      const currentClass=activeClass();localStorage.setItem(ACTIVE_CLASS_KEY,currentClass);const progress=loadProgress(currentClass);const count=ROOMS.filter(r=>progress.completed[r.id]).length;const percent=Math.round(count/ROOMS.length*100);
      const rooms=ROOMS.map((room,index)=>{const done=Boolean(progress.completed[room.id]);return `<article class="room ${done?"done":""}"><div class="room-head"><div><p class="eyebrow">Area ${index+1}</p><h3>${esc(room.name)}</h3></div><span class="status ${done?"ok":""}">${done?"COMPLETATA":"IN ATTESA"}</span></div>${done?"<p>Password verificata e registrata.</p>":`<form class="room-form" data-room="${room.id}" autocomplete="off"><input aria-label="Password ${esc(room.name)}" placeholder="Inserisci la password recuperata" required><button class="btn" type="submit">Verifica</button></form><div id="msg-${room.id}" class="message"></div>`}</article>`}).join("");
      const options=CLASSES.map(c=>`<option value="${c}" ${c===currentClass?"selected":""}>${c}</option>`).join("");
      screen.innerHTML=`<div class="dashboard-heading"><h1>Stato della missione</h1><p>${count} aree completate su ${ROOMS.length}.</p><div class="progress-track" aria-label="Avanzamento ${percent}%"><div class="progress-bar" style="width:${percent}%"></div></div></div><div class="room-list">${rooms}</div>${count===ROOMS.length?'<div class="locked mission-summary">TUTTE LE STANZE COMPLETATE — Cercate il protocollo di uscita.</div>':""}<div class="class-control"><label for="classSelect">Classe selezionata</label><select id="classSelect">${options}</select></div>`;
      document.querySelectorAll(".room-form").forEach(form=>form.addEventListener("submit",event=>{event.preventDefault();const room=ROOMS.find(r=>r.id===form.dataset.room),answer=form.querySelector("input").value;if(!room||normalize(answer)!==normalize(room.code)){document.getElementById(`msg-${form.dataset.room}`).textContent="Password non riconosciuta. Controllate gli indizi e riprovate.";return}const p=loadProgress(currentClass);p.completed[room.id]=true;saveProgress(currentClass,p);render()}));
      document.getElementById("classSelect").addEventListener("change",event=>{localStorage.setItem(ACTIVE_CLASS_KEY,event.target.value);render()});
    }
    window.addEventListener("storage",render);render();
  </script>
</body>
</html>
