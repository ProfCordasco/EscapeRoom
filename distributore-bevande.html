
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distributore bevande</title>
<style>
:root{--bg:#030a10;--panel:#091d29;--line:#27637b;--cyan:#4de6ff;--red:#ff536c;--text:#edfbff;--muted:#92a9b7}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;background:transparent;color:var(--text)}
body{display:grid;place-items:center;padding:8px}
.machine{position:relative;width:min(700px,100%);height:100%;min-height:320px;display:grid;grid-template-columns:1fr 1.15fr;gap:18px;padding:22px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#0b2635,#020a11);box-shadow:0 0 32px #42e2ff24,inset 0 0 45px #0f60751c}
.visual{display:grid;place-items:center;border:1px solid #20495c;border-radius:14px;background:radial-gradient(circle,#123c4d,#04111a 68%)}.cup{font-size:clamp(6rem,18vw,11rem);filter:drop-shadow(0 0 20px #4ae4ff42)}
.panel{display:flex;flex-direction:column;justify-content:center}.display{min-height:105px;display:grid;place-items:center;padding:13px;margin-bottom:13px;border:1px solid #2d6074;border-radius:10px;background:#01080d;text-align:center;color:var(--cyan);font:700 1rem Consolas,monospace;white-space:pre-line}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choices button{padding:14px 8px;border:1px solid #35677b;border-radius:9px;background:#0b2837;color:white;font-weight:800;cursor:pointer}.choices button:hover{border-color:var(--cyan);background:#10394a}.choices button:disabled{opacity:.45;cursor:not-allowed}
.reset{margin-top:11px;padding:9px;border:1px solid #3a5a69;border-radius:8px;background:transparent;color:#a9bfca;cursor:pointer}.error{color:var(--red)!important}
@media(max-width:520px){.machine{grid-template-columns:.65fr 1.35fr;padding:10px;gap:8px}.choices button{padding:10px 4px;font-size:.72rem}.display{font-size:.78rem}}
</style>
</head>
<body>
<main class="machine">
 <div class="visual"><div class="cup">☕</div></div>
 <section class="panel">
  <div class="display" id="display">SELEZIONARE
UNA BEVANDA</div>
  <div class="choices"><button>ESPRESSO</button><button>CAPPUCCINO</button><button>TÈ</button><button>ACQUA</button></div>
  <button class="reset" id="reset">ANNULLA</button>
 </section>
</main>
<script>
(()=>{const display=document.querySelector('#display'),buttons=[...document.querySelectorAll('.choices button')],reset=document.querySelector('#reset');buttons.forEach(b=>b.addEventListener('click',()=>{buttons.forEach(x=>x.disabled=true);display.classList.add('error');display.textContent='SERVIZIO NON DISPONIBILE\n\nManutenzione programmata.\nRivolgersi al reparto assistenza.'}));reset.addEventListener('click',()=>{buttons.forEach(x=>x.disabled=false);display.classList.remove('error');display.textContent='SELEZIONARE\nUNA BEVANDA'})})();
</script>
</body></html>
