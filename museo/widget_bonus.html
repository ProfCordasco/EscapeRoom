<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bonus — Museo dell'Informatica</title>
<style>
:root{
  --bg:#04111d;
  --panel:#0a2233;
  --line:#245f78;
  --cyan:#5be8ff;
  --text:#eefcff;
  --muted:#8eacbc;
  --off:#263b47;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  overflow:hidden;
}
body{
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:transparent;
  color:var(--text);
}
.widget{
  width:100%;
  height:100%;
  min-height:70px;
  padding:clamp(5px,1.6vw,10px);
  border:1px solid rgba(91,232,255,.25);
  border-radius:clamp(9px,2vw,14px);
  background:linear-gradient(145deg,rgba(5,20,32,.96),rgba(3,13,23,.96));
  box-shadow:inset 0 0 18px rgba(91,232,255,.035);
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:clamp(4px,1vw,7px);
}
.title{
  font-size:clamp(7px,2.2vw,11px);
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--cyan);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.groups{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:clamp(3px,.8vw,7px);
}
.group{
  min-width:0;
  padding:clamp(4px,1vw,7px) clamp(3px,.8vw,6px);
  border:1px solid rgba(91,232,255,.11);
  border-radius:clamp(7px,1.4vw,10px);
  background:rgba(9,31,47,.68);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(3px,.8vw,6px);
}
.name{
  font-size:clamp(7px,1.9vw,10px);
  font-weight:800;
  color:#d9f8ff;
  white-space:nowrap;
}
.dots{
  display:flex;
  gap:clamp(2px,.5vw,4px);
  flex:0 0 auto;
}
.dot{
  width:clamp(7px,2.2vw,11px);
  height:clamp(7px,2.2vw,11px);
  border-radius:50%;
  border:1px solid rgba(91,232,255,.45);
  background:var(--cyan);
  box-shadow:0 0 7px rgba(91,232,255,.5);
}
.dot.spent{
  background:var(--off);
  border-color:rgba(255,255,255,.12);
  box-shadow:none;
  opacity:.4;
}
.no-session{
  font-size:clamp(7px,2vw,10px);
  color:var(--muted);
  text-align:center;
  line-height:1.2;
}
@media(max-width:260px){
  .groups{grid-template-columns:repeat(2,minmax(0,1fr))}
  .widget{min-height:95px}
}
</style>
</head>
<body>
<div class="widget">
  <div class="title">BONUS GRUPPI</div>
  <div class="groups" id="groups"></div>
  <div class="no-session" id="msg"></div>
</div>

<script>
const groupsEl = document.getElementById("groups");
const msgEl = document.getElementById("msg");

function getSession(){
  const classe=(localStorage.getItem("museoInfo_classe")||"").trim().toUpperCase();
  const modalita=(localStorage.getItem("museoInfo_modalita")||"").trim().toLowerCase();
  return {classe,modalita};
}

function prefix(){
  const {classe,modalita}=getSession();
  return `museoInfo_${classe}_${modalita}`;
}

function validSession(){
  const {classe,modalita}=getSession();
  return !!classe && ["ripasso","consolidamento"].includes(modalita);
}

function bonusSpent(group,slot){
  return localStorage.getItem(`${prefix()}_bonus_g${group}_${slot}`)==="spent";
}

function render(){
  groupsEl.innerHTML="";

  if(!validSession()){
    msgEl.textContent="Sessione non configurata";
    return;
  }

  msgEl.textContent="";

  for(let g=1;g<=4;g++){
    const box=document.createElement("div");
    box.className="group";

    const name=document.createElement("div");
    name.className="name";
    name.textContent=`G${g}`;

    const dots=document.createElement("div");
    dots.className="dots";

    for(let s=1;s<=2;s++){
      const d=document.createElement("span");
      d.className="dot"+(bonusSpent(g,s)?" spent":"");
      dots.appendChild(d);
    }

    box.appendChild(name);
    box.appendChild(dots);
    groupsEl.appendChild(box);
  }
}

render();

// aggiornamento continuo per restare sincronizzato anche dentro iframe/Genially
setInterval(render,500);
window.addEventListener("storage",render);
window.addEventListener("focus",render);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) render(); });
</script>
</body>
</html>
