<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codificatore — Museo dell'Informatica</title>
<style>
:root{
  --bg:#020b14;
  --panel:#071a2a;
  --panel2:#0b2436;
  --line:#1f607c;
  --cyan:#59e9ff;
  --cyan2:#baf8ff;
  --green:#4cf0a4;
  --yellow:#ffd46b;
  --red:#ff6679;
  --text:#f1fcff;
  --muted:#9cb9c9;
}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;overflow-x:hidden;overflow-y:auto}
body{
  font-family:Inter,Segoe UI,Arial,sans-serif;
  color:var(--text);
  background:linear-gradient(145deg,#020b14,#061a2b 58%,#020812);
}
.app{
  width:100%;min-height:100vh;position:relative;padding:3vh 4vw 5vh;
  background:
    radial-gradient(circle at 50% 28%,rgba(49,150,255,.14),transparent 30%),
    linear-gradient(145deg,#020b14,#061a2b 58%,#020812);
}
.top{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  margin-bottom:2.4vh;
}
.kicker{
  color:var(--cyan);
  text-transform:uppercase;
  letter-spacing:.22em;
  font-size:clamp(11px,.9vw,15px);
  font-weight:800;
}
h1{
  margin:.25em 0 0;
  font-size:clamp(36px,4.4vw,66px);
  line-height:.95;
  letter-spacing:-.03em;
}
.session{
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.11em;
  font-size:clamp(10px,.8vw,13px);
  text-align:right;
}
.grid-wrap{
  width:min(1120px,100%);
  margin:0 auto;
}
.collection{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.slot{
  min-height:78px;
  border:1px solid rgba(89,233,255,.22);
  border-radius:18px;
  background:linear-gradient(160deg,rgba(8,30,48,.88),rgba(4,17,29,.9));
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.slot::before{
  content:"";
  position:absolute;inset:10px;border-radius:13px;
  border:1px solid rgba(89,233,255,.07);
}
.slot .symbol{
  font-size:clamp(27px,3vw,44px);
  color:#355b6c;
  text-shadow:none;
  transform:scale(.98);
  transition:.2s ease;
  z-index:2;
}
.slot.solved{
  border-color:rgba(89,233,255,.55);
  box-shadow:0 0 20px rgba(89,233,255,.08),inset 0 0 24px rgba(89,233,255,.04);
}
.slot.solved .symbol{
  color:var(--cyan2);
  text-shadow:0 0 16px rgba(89,233,255,.55);
  transform:scale(1.05);
}
.slot .idx{
  position:absolute;left:12px;top:9px;
  font-size:10px;letter-spacing:.12em;color:#577b8c;
  z-index:3;
}
.progress{
  margin:14px auto 0;
  width:min(1120px,100%);
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:16px;
}
.card{
  border:1px solid rgba(89,233,255,.22);
  border-radius:18px;
  background:rgba(4,17,29,.78);
  padding:14px 18px;
}
.progress-title,.bonus-title{
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.13em;
  font-size:11px;font-weight:800;
}
.progress-row{
  display:flex;align-items:end;justify-content:space-between;gap:20px;margin-top:8px;
}
.count{
  font-size:clamp(34px,3.4vw,54px);
  font-weight:900;color:var(--cyan2);line-height:1;
}
.bar{height:8px;background:#0c2a3b;border-radius:999px;overflow:hidden;margin-top:12px}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#58e9ff,#4cf0a4);transition:.3s}
.decode{
  margin-top:12px;width:100%;
  border:1px solid rgba(89,233,255,.22);
  border-radius:14px;padding:14px 18px;
  background:#0b2638;color:#507181;
  font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  cursor:not-allowed;
}
.decode.ready{
  cursor:pointer;
  color:#041116;
  background:linear-gradient(180deg,#a8f6ff,#54def0);
  border-color:var(--cyan);
  box-shadow:0 0 24px rgba(89,233,255,.15);
}
.bonuses{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;
}
.group{
  border:1px solid rgba(89,233,255,.12);
  border-radius:14px;padding:12px;
  background:rgba(7,27,43,.54);
}
.group-name{
  color:#d9f6fb;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:9px;
}
.dots{display:flex;gap:9px}
.dot{
  width:22px;height:22px;border-radius:50%;
  border:1px solid rgba(89,233,255,.45);
  background:rgba(89,233,255,.12);
  box-shadow:inset 0 0 8px rgba(89,233,255,.08);
  cursor:pointer;
}
.dot.active{
  background:var(--cyan);
  box-shadow:0 0 14px rgba(89,233,255,.45);
}
.dot.spent{
  opacity:.25;cursor:default;background:#203541;
}
.status{
  margin-top:14px;min-height:20px;color:var(--muted);font-size:13px;
}
.password-panel{
  position:fixed;inset:0;background:rgba(1,7,12,.86);
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(6px);
}
.password-panel.show{display:flex}
.password-box{
  width:min(620px,92vw);
  border:1px solid rgba(89,233,255,.42);
  border-radius:24px;
  background:linear-gradient(145deg,#061827,#03101b);
  padding:34px;text-align:center;
  box-shadow:0 30px 90px rgba(0,0,0,.45),0 0 34px rgba(89,233,255,.09);
}
.password-kicker{
  color:var(--green);letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:900
}
.password-title{font-size:clamp(27px,3vw,42px);font-weight:900;margin:12px 0 8px}
.password{
  font-size:clamp(54px,7vw,90px);font-weight:900;letter-spacing:.18em;color:var(--cyan2);
  text-shadow:0 0 24px rgba(89,233,255,.32);margin:12px 0 18px
}
.close{
  border:1px solid rgba(89,233,255,.28);border-radius:12px;padding:11px 18px;
  background:#0b2638;color:var(--cyan2);font-weight:800;cursor:pointer
}
.warn{color:#ffb0b9}
@media(max-width:760px){
  .app{height:auto;min-height:100vh}
  .collection{grid-template-columns:repeat(2,1fr)}
  .progress{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <div class="kicker">Sistema di raccolta reperti</div>
      <h1>CODIFICATORE</h1>
    </div>
    <div class="session" id="session">Sessione non configurata</div>
  </div>

  <div class="grid-wrap">
    <div class="collection" id="collection"></div>
  </div>

  <div class="progress">
    <section class="card">
      <div class="progress-title">Reperti acquisiti</div>
      <div class="progress-row">
        <div class="count"><span id="done">0</span> / 11</div>
        <div id="readyText" class="status">Raccogliete tutti i simboli per attivare la decodifica.</div>
      </div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <button class="decode" id="decodeBtn" disabled>Decodifica</button>
      <div class="status" id="status"></div>
    </section>

    <section class="card">
      <div class="bonus-title">Bonus disponibili</div>
      <div class="bonuses" id="bonuses"></div>
      <div class="status">Ogni gruppo dispone di 2 aiuti per sessione.</div>
    </section>
  </div>
</div>

<div class="password-panel" id="passwordPanel">
  <div class="password-box">
    <div class="password-kicker">Decodifica completata</div>
    <div class="password-title">PASSWORD DI USCITA</div>
    <div class="password" id="passwordValue">----</div>
    <button class="close" id="closeBtn">Chiudi</button>
  </div>
</div>

<script>
const classe = (localStorage.getItem("museoInfo_classe") || "").trim().toUpperCase();
const modalita = (localStorage.getItem("museoInfo_modalita") || "").trim().toLowerCase();

const session = document.getElementById("session");
const collection = document.getElementById("collection");
const bonuses = document.getElementById("bonuses");
const doneEl = document.getElementById("done");
const fill = document.getElementById("fill");
const readyText = document.getElementById("readyText");
const decodeBtn = document.getElementById("decodeBtn");
const status = document.getElementById("status");
const passwordPanel = document.getElementById("passwordPanel");
const passwordValue = document.getElementById("passwordValue");

const TOTALE_ENIGMI = 11;
const SYMBOLS = ["◈","⬡","⌬","◉","◇","⬢","⟡","✦","◌","⬟","✧"];

function prefix(){
  return `museoInfo_${classe}_${modalita}`;
}
function validSession(){
  return !!classe && ["ripasso","consolidamento"].includes(modalita);
}
function puzzleKey(i){
  return `${prefix()}_enigma${String(i).padStart(2,"0")}`;
}
function bonusKey(group,slot){
  return `${prefix()}_bonus_g${group}_${slot}`;
}
function isSolved(i){
  const keys = [
    puzzleKey(i),
    `${prefix()}_enigma${i}`,
    `${prefix()}_postazione${String(i).padStart(2,"0")}`,
    `${prefix()}_postazione${i}`
  ];
  return keys.some(k=>{
    const v=(localStorage.getItem(k)||"").toLowerCase();
    return ["true","1","completato","completed","solved"].includes(v);
  });
}
function renderSlots(){
  collection.innerHTML="";
  for(let i=1;i<=TOTALE_ENIGMI;i++){
    const slot=document.createElement("div");
    slot.className="slot"+(isSolved(i)?" solved":"");
    slot.innerHTML=`<span class="idx">${String(i).padStart(2,"0")}</span>
                    <span class="symbol">${isSolved(i)?SYMBOLS[i-1]:"◇"}</span>`;
    collection.appendChild(slot);
  }
}
function completed(){
  let n=0;
  for(let i=1;i<=TOTALE_ENIGMI;i++) if(isSolved(i)) n++;
  return n;
}
function renderProgress(){
  const n=completed();
  doneEl.textContent=n;
  fill.style.width=`${(n/TOTALE_ENIGMI)*100}%`;
  renderSlots();

  if(n===TOTALE_ENIGMI){
    decodeBtn.disabled=false;
    decodeBtn.classList.add("ready");
    readyText.textContent="Collezione completa. Il sistema è pronto.";
  }else{
    decodeBtn.disabled=true;
    decodeBtn.classList.remove("ready");
    readyText.textContent="Raccogliete tutti i simboli per attivare la decodifica.";
  }
}
function renderBonuses(){
  bonuses.innerHTML="";
  for(let g=1;g<=4;g++){
    const box=document.createElement("div");
    box.className="group";
    const dots=document.createElement("div");
    dots.className="dots";

    for(let s=1;s<=2;s++){
      const spent = localStorage.getItem(bonusKey(g,s))==="spent";
      const dot=document.createElement("button");
      dot.className="dot "+(spent?"spent":"active");
      dot.title = spent ? "Bonus già utilizzato" : `Usa bonus Gruppo ${g}`;
      dot.disabled = spent;
      dot.addEventListener("click",()=>{
        if(spent) return;
        const ok=confirm(`Usare un bonus del GRUPPO ${g}?\n\nResterà 1 aiuto in meno per questa sessione.`);
        if(!ok) return;
        localStorage.setItem(bonusKey(g,s),"spent");
        status.textContent=`Bonus utilizzato dal Gruppo ${g}.`;
        renderBonuses();
      });
      dots.appendChild(dot);
    }

    box.innerHTML=`<div class="group-name">Gruppo ${g}</div>`;
    box.appendChild(dots);
    bonuses.appendChild(box);
  }
}
function ensurePassword(){
  const key=`${prefix()}_password`;
  let pwd=localStorage.getItem(key);
  if(!pwd){
    pwd=String(Math.floor(1000+Math.random()*9000));
    localStorage.setItem(key,pwd);
  }
  return pwd;
}

if(validSession()){
  session.textContent=`${classe} · ${modalita.toUpperCase()}`;
  renderProgress();
  renderBonuses();
  ensurePassword();
}else{
  session.textContent="Sessione non configurata";
  status.innerHTML='<span class="warn">Configurare prima classe e modalità.</span>';
  decodeBtn.disabled=true;
}

decodeBtn.addEventListener("click",()=>{
  if(completed()!==TOTALE_ENIGMI) return;
  passwordValue.textContent=ensurePassword();
  passwordPanel.classList.add("show");
});

document.getElementById("closeBtn").addEventListener("click",()=>{
  passwordPanel.classList.remove("show");
});

window.addEventListener("storage",()=>{renderProgress();renderBonuses()});
window.addEventListener("focus",()=>{renderProgress();renderBonuses()});
setInterval(()=>{ if(validSession()) renderProgress(); },1200);
</script>
</body>
</html>
