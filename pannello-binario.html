
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pannello binario // Operazione Zero</title>
<style>
:root{--bg:#020912;--panel:#071a28;--line:#1b526c;--cyan:#4be8ff;--green:#48f39b;--red:#ff526b;--yellow:#ffd15c;--text:#eafaff;--muted:#91a8b8}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;background:transparent;color:var(--text)}
body{display:grid;place-items:center;padding:10px}
.console{position:relative;width:min(980px,100%);height:min(610px,100%);min-height:380px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #22627f;border-radius:20px;background:linear-gradient(145deg,rgba(8,29,43,.98),rgba(2,10,18,.99));box-shadow:0 0 38px #39dfff28,inset 0 0 60px #0b587b18}
.console:before{content:"";position:absolute;inset:7px;border:1px solid #1c3e51;border-radius:15px;pointer-events:none}
header{display:flex;align-items:center;gap:13px;padding:17px 22px;border-bottom:1px solid var(--line);background:#061520d9;z-index:1}
.lock{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--cyan);border-radius:10px;color:var(--cyan);font-size:1.4rem;box-shadow:0 0 15px #4be8ff25}
.heading{flex:1}.heading strong{display:block;color:var(--cyan);letter-spacing:.12em}.heading small{color:var(--muted)}
.target{padding:7px 12px;border:1px solid #927326;border-radius:8px;background:#2b2109;color:var(--yellow);font-weight:900;letter-spacing:.08em}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 28px;z-index:1}
.instruction{text-align:center;margin:0 auto 21px;max-width:700px;color:#d5e8f1;line-height:1.45}.instruction b{color:white}
.lights{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;max-width:820px;width:100%;margin:0 auto}
.unit{display:flex;flex-direction:column;align-items:center;gap:9px;padding:13px 8px 14px;border:1px solid #21485c;border-radius:14px;background:#05131e;cursor:pointer;transition:.22s}.unit:hover{border-color:#3887a6;transform:translateY(-2px)}
.lamp{width:clamp(47px,6vw,70px);aspect-ratio:1;border:3px solid #364b58;border-radius:50%;background:radial-gradient(circle at 37% 32%,#64727b,#222e35 40%,#0c1115 72%);box-shadow:inset 0 0 16px #000,0 0 0 4px #02080c;transition:.25s}
.unit.on{border-color:#2d9368;background:#08251d}.unit.on .lamp{border-color:#75ffc0;background:radial-gradient(circle at 37% 32%,#effff7,#55f3a1 25%,#12b66b 62%,#07512f);box-shadow:inset 0 0 11px #fff8,0 0 0 4px #052016,0 0 27px #42f59b}
.n{font-size:.72rem;color:var(--muted);letter-spacing:.08em}.value{font-size:1.45rem;font-weight:900}.unit.on .value{color:var(--green)}
.readout{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:20px}.sum{min-width:176px;padding:10px 17px;border:1px solid #2b5c72;border-radius:9px;background:#020b11;text-align:center}.sum small{display:block;color:var(--muted);font-size:.68rem;letter-spacing:.1em}.sum strong{font:900 2rem Consolas,monospace;color:var(--cyan)}
.actions{display:flex;gap:10px}.actions button{border:0;border-radius:9px;padding:12px 18px;font-weight:900;cursor:pointer}.verify{background:var(--cyan);color:#00151b}.reset{border:1px solid #416276!important;background:#071722;color:#b9d1dc}.feedback{height:25px;margin-top:12px;text-align:center;font-weight:700;color:var(--red)}
.success{position:absolute;inset:0;display:none;place-items:center;padding:25px;background:#020a10f2;z-index:20}.success.show{display:grid}.success-card{width:min(620px,92%);padding:34px;border:1px solid var(--green);border-radius:18px;background:linear-gradient(145deg,#09291e,#051318);text-align:center;box-shadow:0 0 60px #42f59b3d}.check{font-size:3.5rem;color:var(--green)}h1{margin:7px 0;color:var(--green);letter-spacing:.08em}.binary{font:700 1.4rem Consolas,monospace;color:#a9c4d1}.digit{font-size:5rem;font-weight:950;line-height:1;color:#fff;text-shadow:0 0 24px var(--green);margin:12px}
@media(max-width:600px){body{padding:4px}.console{border-radius:10px}.main{padding:12px}.lights{gap:6px}.unit{padding:9px 3px}.readout{flex-direction:column;gap:9px}.instruction{font-size:.86rem;margin-bottom:10px}header{padding:10px 13px}.target{font-size:.75rem}}
</style>
</head>
<body>
<main class="console">
  <section class="main">
    <p class="instruction"><b>Ogni luce accesa aggiunge il valore indicato.</b><br>Attivate le luci necessarie per rappresentare esattamente il numero richiesto.</p>
    <div class="lights" id="lights">
  <button class="unit" data-value="16" aria-pressed="false">
    <span class="lamp"></span>
    <span class="n">LUCE 5</span>
    <span class="value">16</span>
  </button>

  <button class="unit" data-value="8" aria-pressed="false">
    <span class="lamp"></span>
    <span class="n">LUCE 4</span>
    <span class="value">8</span>
  </button>

  <button class="unit" data-value="4" aria-pressed="false">
    <span class="lamp"></span>
    <span class="n">LUCE 3</span>
    <span class="value">4</span>
  </button>

  <button class="unit" data-value="2" aria-pressed="false">
    <span class="lamp"></span>
    <span class="n">LUCE 2</span>
    <span class="value">2</span>
  </button>

  <button class="unit" data-value="1" aria-pressed="false">
    <span class="lamp"></span>
    <span class="n">LUCE 1</span>
    <span class="value">1</span>
  </button>
</div>
    <div class="readout"><div class="sum"><small>TOTALE ATTUALE</small><strong id="total">0</strong></div><div class="actions"><button class="reset" id="reset">AZZERA</button><button class="verify" id="verify">VERIFICA</button></div></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </section>
  <section class="success" id="success"><div class="success-card"><div class="check">✓</div><h1>CONFIGURAZIONE COMPLETATA</h1><p>Segnale binario accettato.</p><div class="binary">16 + 4 + 2 = 22</div><div class="digit">5</div><p><b>5 è una cifra del codice della stanza.</b></p></div></section>
</main>
<script>
(()=>{const units=[...document.querySelectorAll('.unit')],total=document.querySelector('#total'),feedback=document.querySelector('#feedback'),success=document.querySelector('#success');let sum=0;function update(){sum=units.reduce((s,u)=>s+(u.classList.contains('on')?Number(u.dataset.value):0),0);total.textContent=sum;feedback.textContent=''}units.forEach(u=>u.addEventListener('click',()=>{u.classList.toggle('on');u.setAttribute('aria-pressed',u.classList.contains('on'));update()}));document.querySelector('#reset').addEventListener('click',()=>{units.forEach(u=>{u.classList.remove('on');u.setAttribute('aria-pressed','false')});update()});document.querySelector('#verify').addEventListener('click',()=>{if(sum===22){feedback.textContent='';setTimeout(()=>success.classList.add('show'),250)}else{feedback.textContent=sum<22?'Valore troppo basso. Modificate la configurazione.':'Valore troppo alto. Modificate la configurazione.'}});update()})();
</script>
</body>
</html>
