<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Operazione Zero — Configurazione v2</title>
  <style>
    :root{--bg:#020b16;--panel:#061827;--line:#17445a;--cyan:#55e9ff;--green:#48f39b;--red:#ff6177;--text:#f1fbff;--muted:#9ac9df}
    *{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}body{display:grid;place-items:center;padding:28px;color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% 0,#0a3048 0,transparent 45%),linear-gradient(90deg,#03121f,#020b16 48%,#03121f)}
    .frame{position:relative;width:min(1120px,100%);padding:54px 60px;border:1px solid #246078;border-radius:30px;background:linear-gradient(145deg,rgba(6,25,40,.97),rgba(2,12,23,.98));box-shadow:0 0 50px #30cde51b,inset 0 0 55px #0a638321}
    .frame:before,.frame:after{content:"";position:absolute;width:65px;height:65px;border-top:3px solid #a8bfca;top:-2px}.frame:before{left:-2px;border-left:3px solid #a8bfca;border-radius:28px 0 0}.frame:after{right:-2px;border-right:3px solid #a8bfca;border-radius:0 28px 0 0}
    .kicker{color:var(--cyan);font:900 .85rem Consolas,monospace;letter-spacing:.28em;text-transform:uppercase}h1{margin:26px 0 14px;font-size:clamp(2.5rem,6vw,5rem);line-height:.95;letter-spacing:.015em}.lead{max-width:820px;margin:0 0 34px;color:#d4eff9;font-size:1.16rem;line-height:1.55}
    label{display:block;margin-bottom:10px;color:#a9ddf6;font:800 .9rem Consolas,monospace;letter-spacing:.15em;text-transform:uppercase}input{width:100%;padding:20px 22px;border:1px solid #1d5a73;border-radius:20px;outline:0;color:#fff;background:#020e19;font-size:1.45rem;text-transform:uppercase}input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #55e9ff18,0 0 22px #55e9ff18}
    .actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}button{min-height:60px;padding:15px 28px;border-radius:16px;font:900 1rem Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.primary{border:0;color:#00151c;background:linear-gradient(#7cf2ff,#43d1e9);box-shadow:0 0 25px #55e9ff2d}.secondary{border:1px solid #235a71;color:var(--cyan);background:#061725}.reset{border:1px solid #9a3347;color:#fff;background:#2a0d17}
    .message{min-height:26px;margin-top:17px;font-size:1rem;color:var(--muted)}.message.ok{color:var(--green)}.message.err{color:var(--red)}
    .teacher{margin-top:28px;padding-top:22px;border-top:1px solid #12384a}.teacher summary{color:#87abc0;font: .9rem Consolas,monospace;letter-spacing:.08em;cursor:pointer;text-transform:uppercase}.teacher-box{margin-top:18px;padding:18px;border:1px solid #173e51;border-radius:14px;background:#03111d}.teacher-box p{margin:0 0 15px;color:#91cce7;line-height:1.5}
    @media(max-width:700px){body{padding:8px}.frame{padding:32px 22px;border-radius:18px}.actions{flex-direction:column}.actions button{width:100%}}
  </style>
</head>
<body>
  <main class="frame">
    <div class="kicker">Accesso alla missione</div>
    <h1>CONFIGURA OPERAZIONE ZERO</h1>
    <p class="lead">Inserite la classe. La configurazione e lo stato della missione verranno mantenuti per tutto il percorso.</p>

    <label for="classe">Classe</label>
    <input id="classe" type="text" maxlength="12" autocomplete="off" placeholder="Es. 1A">

    <div class="actions">
      <button class="primary" id="saveBtn" type="button">Salva configurazione</button>
      <button class="secondary" id="loadBtn" type="button">Riprendi configurazione</button>
    </div>
    <div class="message" id="message" aria-live="polite"></div>

    <details class="teacher">
      <summary>Gestione docente</summary>
      <div class="teacher-box">
        <p>Il reset cancella soltanto lo stato della classe inserita. I progressi delle altre classi non vengono modificati.</p>
        <button class="reset" id="resetBtn" type="button">Reset percorso della classe</button>
      </div>
    </details>
  </main>

  <script>
    "use strict";

    /* Chiavi condivise con il terminale: non modificare. */
    const ACTIVE_CLASS_KEY = "oz_active_class_v1";
    const PROGRESS_PREFIX = "oz_progress_v1_";

    const classeInput = document.getElementById("classe");
    const message = document.getElementById("message");

    function normalizeClass(value){
      return String(value || "").trim().toLocaleUpperCase("it-IT").replace(/\s+/g, "");
    }

    function progressKey(classe){
      return PROGRESS_PREFIX + encodeURIComponent(classe);
    }

    function emptyProgress(){
      return {
        completed:{osservazione:false,logica:false,informatica:false,assistenza:false},
        updatedAt:new Date().toISOString()
      };
    }

    function showMessage(text,type=""){
      message.className="message" + (type ? " " + type : "");
      message.textContent=text;
    }

    function saveConfiguration(){
      const classe=normalizeClass(classeInput.value);
      if(!classe){
        showMessage("Inserite la classe.","err");
        classeInput.focus();
        return;
      }
      localStorage.setItem(ACTIVE_CLASS_KEY,classe);
      const key=progressKey(classe);
      if(!localStorage.getItem(key)) localStorage.setItem(key,JSON.stringify(emptyProgress()));
      classeInput.value=classe;
      showMessage(`Configurazione salvata: ${classe}. Potete proseguire in Genially.`,"ok");
    }

    function loadConfiguration(){
      const classe=localStorage.getItem(ACTIVE_CLASS_KEY) || "";
      if(!classe){
        showMessage("Non è presente alcuna configurazione salvata.","err");
        return;
      }
      classeInput.value=classe;
      showMessage(`Configurazione caricata: ${classe}.`,"ok");
    }

    function resetClass(){
      const classe=normalizeClass(classeInput.value);
      if(!classe){
        showMessage("Inserite la classe da resettare.","err");
        classeInput.focus();
        return;
      }
      if(!confirm(`Resettare tutti i progressi della classe ${classe}?\n\nLe altre classi non verranno modificate.`)) return;
      localStorage.removeItem(progressKey(classe));
      localStorage.setItem(progressKey(classe),JSON.stringify(emptyProgress()));
      showMessage(`Percorso della classe ${classe} azzerato.`,"ok");
    }

    document.getElementById("saveBtn").addEventListener("click",saveConfiguration);
    document.getElementById("loadBtn").addEventListener("click",loadConfiguration);
    document.getElementById("resetBtn").addEventListener("click",resetClass);
    classeInput.addEventListener("keydown",event=>{if(event.key==="Enter")saveConfiguration()});

    const savedClass=localStorage.getItem(ACTIVE_CLASS_KEY);
    if(savedClass) classeInput.value=savedClass;
  </script>
</body>
</html>
